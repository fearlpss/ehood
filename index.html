<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ehood — General</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="server">E</div>
    <button class="add">+</button>
    <button class="hire-btn" id="hireBtn" aria-label="Hire a guy">🤝</button>
  </aside>

  <main class="app">
    <header class="header">
      <div class="avatar">E</div>
      <div>
        <h1># general</h1>
        <p>Ehood · Welcome to Ehood.</p>
      </div>
      <div class="header-actions">⌕ &nbsp; 👥</div>
    </header>

    <section class="messages">
      <article class="message">
        <div class="msg-avatar">E</div>
        <div>
          <div class="meta"><strong>xo</strong><span class="verified">✓</span><time>Sep 15 at 3:44 PM</time></div>
          <div class="bubble">Hey</div>
        </div>
      </article>
    </section>

    <div class="composer">
      <span class="plus">+</span>
      <input placeholder="Message #general" />
      <button>➤</button>
    </div>
  </main>

  <div class="modal" id="hireModal" aria-hidden="true">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <div class="person">👤</div>
      <h2>Hire a guy</h2>
      <p>Choose a service and send a request.</p>
      <div class="service-list">
        <button>General help</button>
        <button>Errand / pickup</button>
        <button>Other</button>
      </div>
      <p class="small">Requests should only be used for lawful services.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
